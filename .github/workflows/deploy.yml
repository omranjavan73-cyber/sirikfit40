name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: w9jds/setup-firebase@v2
        with:
          tools-version: 13.0.0
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}
      - run: npx firebase-tools deploy --only hosting --project sirikfit40 --token "${{ secrets.FIREBASE_TOKEN }}"
